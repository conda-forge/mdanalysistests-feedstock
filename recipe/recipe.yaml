schema_version: 1

context:
  name: MDAnalysisTests
  version: "2.11.0"
  sha256: 5edeb5b01805da728b202103aa8d2b5974a37f1005ab1fe0150ed7d59702d2ea
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.lower() }}-{{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.15a0
    - mdanalysis ==${{ version }}
    - pytest >=3.3.0
    - hypothesis

tests:
  - python:
      imports:
        - MDAnalysisTests
        - MDAnalysisTests.datafiles
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}

about:
  license: LGPL-2.1-or-later
  license_file: LICENSE
  summary: Tests and test files for MDAnalysis package
  homepage: https://github.com/MDAnalysis/mdanalysis

extra:
  recipe-maintainers:
    - hmacdope
    - orbeckst
    - richardjgowers
    - kain88-de
    - ialibay
    - RMeli
    - lilyminium
    - fiona-naughton
