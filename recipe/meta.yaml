{% set name = "MDAnalysisTests" %}
{% set version = "2.11.0" %}
{% set sha256 = "5edeb5b01805da728b202103aa8d2b5974a37f1005ab1fe0150ed7d59702d2ea" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.lower() }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }},<3.15a0
    - mdanalysis =={{ version }}
    - pytest >=3.3.0
    - hypothesis

test:
  requires:
    - python {{ python_min }}
  imports:
    - MDAnalysisTests
    - MDAnalysisTests.datafiles

about:
  home: https://github.com/MDAnalysis/mdanalysis
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Tests and test files for MDAnalysis package

extra:
  recipe-maintainers:
    - hmacdope
    - orbeckst
    - richardjgowers
    - kain88-de
    - ialibay
    - RMeli
    - lilyminium
    - fiona-naughton
